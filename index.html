<script>
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        if (!input.value.trim()) return;

        // 1. إضافة رسالة المستخدم
        chatBox.innerHTML += `<div class="message-bubble user-msg">${input.value}</div>`;
        const userText = input.value;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // 2. إضافة فقاعة "جاري التحليل"
        const aiId = 'ai-' + Date.now();
        chatBox.innerHTML += `<div id="${aiId}" class="message-bubble ai-msg">جاري التحليل...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        
        // 3. رابط n8n المباشر
        const WEBHOOK_URL = "http://localhost:5678/webhook/f8e57eb3-779f-4dc3-b930-c9111ecb38fb";

        try {
            const response = await fetch(WEBHOOK_URL, { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText })
            });

            // قراءة الرد كنص *مرة واحدة فقط*
            const responseText = await response.text();
            console.log("الرد الخام من السيرفر:", responseText);

            // التحقق من صحة الرد وأنه ليس فارغاً
            if (!response.ok || !responseText.trim()) {
                throw new Error("السيرفر رجع رد فاضي أو فيه مشكلة في الاستجابة");
            }

            // تحويل النص إلى JSON بأمان
            const data = JSON.parse(responseText);

            // استخراج النص (سواء كان n8n مرجع Array أو Object)
            let outputText = "";
            if (Array.isArray(data)) {
                outputText = data[0]?.output || data[0]?.text || JSON.stringify(data[0]);
            } else if (typeof data === 'object') {
                outputText = data.output || data.text || data.message || JSON.stringify(data);
            } else {
                outputText = data;
            }

            document.getElementById(aiId).innerText = outputText;

        } catch (error) {
            console.error("Error Details:", error);
            document.getElementById(aiId).innerText = "عذراً، حدث خطأ أثناء الاتصال بالخادم. تأكدي من تفعيل الورك فلو في n8n.";
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>
